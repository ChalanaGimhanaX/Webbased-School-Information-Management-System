<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Attendance Management - EduCore</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root { --primary-color: #2C3E50; --accent-color: #3498DB; --hover-color: #4A6B8A; --text-dark: #2C3E50; --text-light: #ECF0F1; }
        body { background-color: #F4F7F9; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; display: flex; min-height: 100vh; }
        .sidebar { width: 260px; background-color: var(--primary-color); color: var(--text-light); padding: 20px; display: flex; flex-direction: column; position: fixed; height: 100%; z-index: 100; }
        .brand-logo { font-size: 1.4rem; font-weight: bold; color: var(--text-light); margin-bottom: 40px; text-decoration: none; display: flex; align-items: center; }
        .brand-logo i { color: var(--accent-color); margin-right: 10px; }
        .nav-link { color: #BFC9D4; padding: 12px 15px; border-radius: 6px; margin-bottom: 6px; text-decoration: none; display: flex; align-items: center; transition: all 0.2s ease; cursor: pointer; }
        .nav-link i { margin-right: 12px; width: 20px; text-align: center; }
        .nav-link:hover { background-color: var(--hover-color); color: white; }
        .nav-link.active { background-color: var(--accent-color); color: white; font-weight: 600; }
        .user-footer { margin-top: auto; border-top: 1px solid #4A6B8A; padding-top: 20px; display: flex; align-items: center; }
        .user-avatar { width: 40px; height: 40px; background-color: #8E44AD; color: white; border-radius: 50%; display: flex; justify-content: center; align-items: center; font-weight: bold; margin-right: 10px; }
        .user-name { font-size: 0.9rem; color: white; }
        .user-role { font-size: 0.75rem; color: #BFC9D4; }
        .main-content { margin-left: 260px; padding: 35px 40px; width: calc(100% - 260px); }
        .content-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 25px; }
        .page-title { font-size: 1.6rem; color: var(--text-dark); font-weight: 700; margin-bottom: 4px; }
        .page-subtitle { color: #7F8C8D; font-size: 0.95rem; }
        .btn-primary-edu { background-color: var(--accent-color); color: white; border: none; padding: 10px 24px; border-radius: 6px; font-weight: 500; }
        .btn-primary-edu:hover { background-color: #2980B9; color: white; }
        .card-edu { background: white; border: none; border-radius: 10px; box-shadow: 0 4px 15px rgba(0,0,0,0.04); margin-bottom: 25px; }
        .table-edu th { background-color: #F8F9FA; color: #7F8C8D; font-weight: 600; font-size: 0.85rem; text-transform: uppercase; padding: 14px 16px; }
        .table-edu td { color: var(--text-dark); font-size: 0.92rem; vertical-align: middle; padding: 12px 16px; }
        .tab-section { display: none; }
        .tab-section.active-tab { display: block; }
    </style>
</head>
<body>

<!-- Sidebar -->
<div class="sidebar">
    <a href="#" class="brand-logo"><i class="fas fa-graduation-cap"></i> EduCore</a>
    <a class="nav-link active" id="studentTabBtn" onclick="switchTab('student')">
        <i class="fas fa-user-graduate"></i> Student Attendance
    </a>
    <a class="nav-link" id="teacherTabBtn" onclick="switchTab('teacher')">
        <i class="fas fa-chalkboard-teacher"></i> Teacher Attendance
    </a>
    <a href="/view-attendance" class="nav-link"><i class="fas fa-table-list"></i> View Student Records</a>
    <a href="/view-teacher-attendance" class="nav-link"><i class="fas fa-list-check"></i> View Teacher Records</a>
    <a href="/system-status" class="nav-link"><i class="fas fa-server"></i> System Status</a>
    <div class="user-footer">
        <div class="user-avatar">TC</div>
        <div>
            <div class="user-name">Miss sahathma</div>
            <div class="user-role">Attendance Manager</div>
        </div>
    </div>
</div>

<!-- Main Content Area -->
<div class="main-content">
    <div class="content-header">
        <div>
            <h1 class="page-title" id="pageTitle">Student Attendance Management</h1>
            <p class="page-subtitle" id="pageSubtitle">Mark and record student attendance for classes</p>
        </div>
    </div>

    <!-- 1. STUDENT ATTENDANCE SECTION -->
    <div id="studentSection" class="tab-section active-tab">
        <form action="/save-attendance" method="POST">
            <div class="card card-edu p-4">
                <div class="row g-3 align-items-end">
                    <div class="col-md-5">
                        <label class="form-label fw-bold text-secondary">Select Class / Course</label>
                        <select class="form-select">
                            <option selected>IT Year 1 - Batch A</option>
                            <option value="1">IT Year 1 - Batch B</option>
                        </select>
                    </div>
                    <div class="col-md-5">
                        <label class="form-label fw-bold text-secondary">Attendance Date</label>
                        <input type="date" name="date" id="studentDate" class="form-control" required>
                    </div>
                    <div class="col-md-2">
                        <button type="button" class="btn btn-outline-primary w-100" onclick="addStudentRow()"><i class="fas fa-user-plus"></i> Add</button>
                    </div>
                </div>
            </div>

            <div class="card card-edu shadow-sm">
                <div class="card-body p-4">
                    <div class="table-responsive">
                        <table class="table table-edu align-middle mb-0">
                            <thead>
                            <tr><th>STUDENT ID</th><th>STUDENT NAME</th><th>STATUS</th><th></th></tr>
                            </thead>
                            <tbody id="studentTbody">
                            <tr>
                                <td><input type="text" name="studentId" value="ST001" class="form-control" required></td>
                                <td><input type="text" name="studentName" value="Nimal Perera" class="form-control" required></td>
                                <td>
                                    <select name="status" class="form-select fw-semibold">
                                        <option value="Present" class="text-success">Present</option>
                                        <option value="Absent" class="text-danger">Absent</option>
                                    </select>
                                </td>
                                <td class="text-center"><button type="button" class="btn btn-sm text-danger" onclick="this.closest('tr').remove()"><i class="fas fa-times"></i></button></td>
                            </tr>
                            </tbody>
                        </table>
                    </div>
                    <div class="mt-4 text-end">
                        <button type="submit" class="btn btn-primary-edu px-5"><i class="fas fa-save me-1"></i> Save Student Attendance</button>
                    </div>
                </div>
            </div>
        </form>
    </div>

    <!-- 2. TEACHER ATTENDANCE SECTION -->
    <div id="teacherSection" class="tab-section">
        <form action="/save-teacher-attendance" method="POST">
            <div class="card card-edu p-4">
                <div class="row g-3 align-items-end">
                    <div class="col-md-5">
                        <label class="form-label fw-bold text-secondary">Department</label>
                        <input type="text" name="department" class="form-control" value="IT Department" required>
                    </div>
                    <div class="col-md-5">
                        <label class="form-label fw-bold text-secondary">Attendance Date</label>
                        <input type="date" name="date" id="teacherDate" class="form-control" required>
                    </div>
                    <div class="col-md-2">
                        <button type="button" class="btn btn-outline-primary w-100" onclick="addTeacherRow()"><i class="fas fa-user-plus"></i> Add</button>
                    </div>
                </div>
            </div>

            <div class="card card-edu shadow-sm">
                <div class="card-body p-4">
                    <div class="table-responsive">
                        <table class="table table-edu align-middle mb-0">
                            <thead>
                            <tr><th>TEACHER ID</th><th>TEACHER NAME</th><th>STATUS</th><th></th></tr>
                            </thead>
                            <tbody id="teacherTbody">
                            <tr>
                                <td><input type="text" name="teacherId" value="T001" class="form-control" required></td>
                                <td><input type="text" name="teacherName" value="Dr. Perera" class="form-control" required></td>
                                <td>
                                    <select name="status" class="form-select fw-semibold">
                                        <option value="Present" class="text-success">Present</option>
                                        <option value="Absent" class="text-danger">Absent</option>
                                    </select>
                                </td>
                                <td class="text-center"><button type="button" class="btn btn-sm text-danger" onclick="this.closest('tr').remove()"><i class="fas fa-times"></i></button></td>
                            </tr>
                            </tbody>
                        </table>
                    </div>
                    <div class="mt-4 text-end">
                        <button type="submit" class="btn btn-primary-edu px-5"><i class="fas fa-save me-1"></i> Save Teacher Attendance</button>
                    </div>
                </div>
            </div>
        </form>
    </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script>
    document.addEventListener('DOMContentLoaded', () => {
        const today = new Date().toISOString().split('T')[0];
        document.getElementById('studentDate').value = today;
        document.getElementById('teacherDate').value = today;
    });

    function switchTab(type) {
        const studentSec = document.getElementById('studentSection');
        const teacherSec = document.getElementById('teacherSection');
        const studentBtn = document.getElementById('studentTabBtn');
        const teacherBtn = document.getElementById('teacherTabBtn');
        const title = document.getElementById('pageTitle');
        const subtitle = document.getElementById('pageSubtitle');

        if (type === 'student') {
            studentSec.classList.add('active-tab');
            teacherSec.classList.remove('active-tab');
            studentBtn.classList.add('active');
            teacherBtn.classList.remove('active');
            title.innerText = "Student Attendance Management";
            subtitle.innerText = "Mark and record student attendance for classes";
        } else {
            teacherSec.classList.add('active-tab');
            studentSec.classList.remove('active-tab');
            teacherBtn.classList.add('active');
            studentBtn.classList.remove('active');
            title.innerText = "Teacher Attendance Management";
            subtitle.innerText = "Mark and record teacher attendance for departments";
        }
    }

    let sCount = 2;
    function addStudentRow() {
        const tbody = document.getElementById('studentTbody');
        const row = document.createElement('tr');
        row.innerHTML = `
            <td><input type="text" name="studentId" value="ST00${sCount++}" class="form-control" required></td>
            <td><input type="text" name="studentName" placeholder="Student Name" class="form-control" required></td>
            <td>
                <select name="status" class="form-select fw-semibold">
                    <option value="Present" class="text-success">Present</option>
                    <option value="Absent" class="text-danger">Absent</option>
                </select>
            </td>
            <td class="text-center"><button type="button" class="btn btn-sm text-danger" onclick="this.closest('tr').remove()"><i class="fas fa-times"></i></button></td>
        `;
        tbody.appendChild(row);
    }

    let tCount = 2;
    function addTeacherRow() {
        const tbody = document.getElementById('teacherTbody');
        const row = document.createElement('tr');
        row.innerHTML = `
            <td><input type="text" name="teacherId" value="T00${tCount++}" class="form-control" required></td>
            <td><input type="text" name="teacherName" placeholder="Teacher Name" class="form-control" required></td>
            <td>
                <select name="status" class="form-select fw-semibold">
                    <option value="Present" class="text-success">Present</option>
                    <option value="Absent" class="text-danger">Absent</option>
                </select>
            </td>
            <td class="text-center"><button type="button" class="btn btn-sm text-danger" onclick="this.closest('tr').remove()"><i class="fas fa-times"></i></button></td>
        `;
        tbody.appendChild(row);
    }
</script>
</body>
</html>
