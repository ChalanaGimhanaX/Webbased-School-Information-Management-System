<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EduCore SIS - Update Attendance</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap');
        body { font-family: 'Plus Jakarta Sans', sans-serif; }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 antialiased min-h-screen flex">

<aside th:replace="~{fragments/sidebar :: nav('student-attendance')}"></aside>

<main class="flex-1 flex flex-col min-w-0 overflow-y-auto">
    <header class="h-16 bg-white border-b border-slate-200 px-6 flex items-center justify-between sticky top-0 z-10">
        <div>
            <h1 class="text-lg font-bold text-slate-900">Update Attendance Record</h1>
            <p class="text-xs text-slate-500">Modify student details, attendance date, and status</p>
        </div>
        <a th:href="@{/view-attendance}" class="flex items-center gap-2 border border-slate-200 hover:bg-slate-50 text-slate-600 text-xs font-semibold px-3.5 py-2 rounded-lg">
            <i class="fa-solid fa-arrow-left"></i> Back to List
        </a>
    </header>

    <div class="p-6 max-w-5xl w-full mx-auto grid grid-cols-1 lg:grid-cols-3 gap-6">
        <div class="lg:col-span-2 bg-white rounded-xl border border-slate-200 shadow-sm p-6">
            <div class="mb-5 p-3 rounded-lg bg-indigo-50 border border-indigo-100 text-xs text-indigo-800">
                Editing attendance record <strong>#<span th:text="${attendance.id}"></span></strong>
                for <strong th:text="${attendance.studentName}"></strong>
            </div>
            <form action="/update-attendance" method="POST" class="space-y-4">
                <input type="hidden" name="id" th:value="${attendance.id}">
                <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                    <div>
                        <label class="block text-xs font-semibold text-slate-600 mb-1">Student ID</label>
                        <input type="text" name="studentId" class="w-full text-xs px-3 py-2 border border-slate-200 rounded-lg" th:value="${attendance.studentId}" required>
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-slate-600 mb-1">Student Name</label>
                        <input type="text" name="studentName" class="w-full text-xs px-3 py-2 border border-slate-200 rounded-lg"
                               th:value="${attendance.studentName}" required pattern="[A-Za-z\s]+"
                               oninput="this.value = this.value.replace(/[^a-zA-Z\s]/g, '')">
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-slate-600 mb-1">Attendance Date</label>
                        <input type="date" name="date" class="w-full text-xs px-3 py-2 border border-slate-200 rounded-lg" th:value="${attendance.date}" required>
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-slate-600 mb-1">Status</label>
                        <div class="flex gap-3">
                            <label class="flex-1 flex items-center gap-2 border border-slate-200 rounded-lg px-3 py-2 text-xs font-semibold cursor-pointer">
                                <input type="radio" name="status" value="Present" th:checked="${attendance.status == 'Present' || attendance.status == null}">
                                <span class="text-emerald-700">Present</span>
                            </label>
                            <label class="flex-1 flex items-center gap-2 border border-slate-200 rounded-lg px-3 py-2 text-xs font-semibold cursor-pointer">
                                <input type="radio" name="status" value="Absent" th:checked="${attendance.status == 'Absent'}">
                                <span class="text-rose-700">Absent</span>
                            </label>
                        </div>
                    </div>
                </div>
                <div class="flex items-center justify-between pt-4 border-t border-slate-100">
                    <a th:href="@{/view-attendance}" class="text-xs font-semibold text-slate-500 hover:text-slate-800">Cancel</a>
                    <div class="flex gap-2">
                        <a th:href="@{/delete-attendance(id=${attendance.id})}" class="px-3.5 py-2 text-xs font-semibold text-rose-600 border border-rose-200 rounded-lg hover:bg-rose-50">Delete</a>
                        <button type="submit" class="bg-indigo-600 hover:bg-indigo-700 text-white text-xs font-semibold px-4 py-2 rounded-lg shadow-sm">Save Changes</button>
                    </div>
                </div>
            </form>
        </div>

        <div class="space-y-4">
            <div class="bg-white rounded-xl border border-slate-200 shadow-sm p-5 text-xs">
                <h3 class="font-bold text-slate-800 mb-3">Record Details</h3>
                <dl class="space-y-2 text-slate-600">
                    <div class="flex justify-between"><dt>Record ID</dt><dd class="font-mono" th:text="${attendance.id}"></dd></div>
                    <div class="flex justify-between"><dt>Student ID</dt><dd class="font-medium" th:text="${attendance.studentId}"></dd></div>
                    <div class="flex justify-between"><dt>Name</dt><dd class="font-medium" th:text="${attendance.studentName}"></dd></div>
                    <div class="flex justify-between"><dt>Date</dt><dd th:text="${attendance.date}"></dd></div>
                    <div class="flex justify-between"><dt>Status</dt><dd th:text="${attendance.status}"></dd></div>
                </dl>
            </div>
            <a th:href="@{/system-status}" class="block text-center text-xs font-semibold border border-slate-200 rounded-lg py-2 text-slate-600 hover:bg-slate-50">Check DB Connectivity</a>
        </div>
    </div>
</main>
</body>
</html>
