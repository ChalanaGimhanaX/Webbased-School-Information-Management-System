spring.application.name=sims-server
server.port=8080

# MySQL Database
spring.datasource.url=jdbc:mysql://localhost:3306/sim_system_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
# Override locally with DB_USERNAME / DB_PASSWORD env vars instead of editing this file
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:Shi@lkasd2}
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# RFC 7807 Problem Details
spring.mvc.problemdetails.enabled=true

# JWT
jwt.secret=c2xpaXQtc2ltcy1zZTIwMzAtand0LXNlY3JldC1rZXktMjAyNi1wcm9qZWN0LXNlY3VyaXR5
jwt.expiration-ms=86400000

# H2 Console (disabled for MySQL)
spring.h2.console.enabled=false

# Student AI Assistant (OpenRouter AI)
sims.assistant.openrouter.api-key=${OPENROUTER_API_KEY:}
sims.assistant.openrouter.model=${OPENROUTER_MODEL:apodex/apodex-1.1-mini:free}
sims.assistant.openrouter.base-url=${OPENROUTER_BASE_URL:https://openrouter.ai/api/v1}
sims.assistant.openrouter.timeout-seconds=45
sims.assistant.time-zone=Asia/Colombo

# Student AI Assistant (Google Gemini fallback/alternative)
sims.assistant.gemini.api-key=${GEMINI_API_KEY:}
sims.assistant.gemini.model=${GEMINI_MODEL:gemini-flash-latest}
sims.assistant.gemini.timeout-seconds=45
