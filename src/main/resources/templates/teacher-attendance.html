<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Teacher Attendance - EduCore</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-light">

<div class="container mt-5" style="max-width: 700px;">
    <div class="card shadow p-4">
        <h2 class="mb-4 text-center">Mark Teacher Attendance</h2>

        <!-- Teacher Attendance Save වන Form එක -->
        <form th:action="@{/save-teacher-attendance}" method="post">

            <div class="mb-3">
                <label class="form-label">Teacher ID</label>
                <input type="text" class="form-control" name="teacherId" placeholder="Enter Teacher ID" required>
            </div>

            <div class="mb-3">
                <label class="form-label">Teacher Name (Letters only)</label>
                <!-- නමට අකුරු පමණක් ඇතුළත් කිරීමට JavaScript Validation එක -->
                <input type="text" class="form-control" name="teacherName" onkeypress="return isAlphabet(event)" placeholder="Enter name (Letters only)" required>
            </div>

            <div class="mb-3">
                <label class="form-label">Department</label>
                <input type="text" class="form-control" name="department" placeholder="Enter Department" required>
            </div>

            <div class="mb-3">
                <label class="form-label">Date</label>
                <input type="date" class="form-control" name="date" required>
            </div>

            <div class="mb-3">
                <label class="form-label">Status</label>
                <select class="form-select" name="status" required>
                    <option value="" disabled selected>Select Status</option>
                    <option value="Present">Present</option>
                    <option value="Absent">Absent</option>
                </select>
            </div>

            <button type="submit" class="btn btn-primary w-100">Save Teacher Attendance</button>
            <a href="/view-teacher-attendance" class="btn btn-secondary w-100 mt-2">View Teacher Records</a>
        </form>
    </div>
</div>

<!-- JavaScript Validation for Letters Only -->
<script>
    function isAlphabet(evt) {
        var charCode = (evt.which) ? evt.which : evt.keyCode;
        if ((charCode >= 65 && charCode <= 90) || (charCode >= 97 && charCode <= 122) || charCode == 32) {
            return true;
        } else {
            return false;
        }
    }
</script>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
