spring.application.name=sims-server
server.port=8080

# MySQL Database
spring.datasource.url=jdbc:mysql://localhost:3306/sim_system_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
# Override locally with DB_USERNAME / DB_PASSWORD env vars instead of editing this file
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:Shi@lkasd2}
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# RFC 7807 Problem Details
spring.mvc.problemdetails.enabled=true

# JWT
jwt.secret=c2xpaXQtc2ltcy1zZTIwMzAtand0LXNlY3JldC1rZXktMjAyNi1wcm9qZWN0LXNlY3VyaXR5
jwt.expiration-ms=86400000

# H2 Console (disabled for MySQL)
spring.h2.console.enabled=false

# Student AI Assistant (Google Gemini). Leave GEMINI_API_KEY unset to disable the assistant (returns HTTP 503).
# Get a key from https://aistudio.google.com/apikey and set it as an environment variable - never commit it.
sims.assistant.gemini.api-key=${GEMINI_API_KEY:}
sims.assistant.gemini.model=${GEMINI_MODEL:gemini-flash-latest}
sims.assistant.gemini.timeout-seconds=45
sims.assistant.time-zone=Asia/Colombo
