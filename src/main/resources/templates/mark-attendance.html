<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EduCore SIS - Mark Attendance</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap');
        body { font-family: 'Plus Jakarta Sans', sans-serif; }
        .tab-section { display: none; }
        .tab-section.active-tab { display: block; }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 antialiased min-h-screen flex">

<aside th:replace="~{fragments/sidebar :: nav('student-attendance')}"></aside>

<main class="flex-1 flex flex-col min-w-0 overflow-y-auto">
    <header class="h-16 bg-white border-b border-slate-200 px-6 flex items-center justify-between sticky top-0 z-10">
        <div>
            <h1 id="pageTitle" class="text-lg font-bold text-slate-900">Student Attendance Management</h1>
            <p id="pageSubtitle" class="text-xs text-slate-500">Mark and record attendance for classes</p>
        </div>
        <div class="flex items-center gap-1 bg-slate-100 p-1 rounded-lg">
            <button type="button" id="studentTabBtn" onclick="switchTab('student')" class="px-3 py-1.5 rounded-md text-xs font-semibold bg-white text-indigo-700 shadow-sm">Students</button>
            <button type="button" id="teacherTabBtn" onclick="switchTab('teacher')" class="px-3 py-1.5 rounded-md text-xs font-semibold text-slate-500 hover:text-slate-800">Teachers</button>
        </div>
    </header>

    <div class="p-6 space-y-6 max-w-6xl w-full mx-auto">
        <div id="studentSection" class="tab-section active-tab space-y-4">
            <form action="/save-attendance" method="POST" class="space-y-4">
                <div class="bg-white p-5 rounded-xl border border-slate-200 shadow-sm grid grid-cols-1 md:grid-cols-3 gap-4 items-end">
                    <div>
                        <label class="block text-xs font-semibold text-slate-600 mb-1">Class / Course</label>
                        <select class="w-full text-xs px-3 py-2 border border-slate-200 rounded-lg focus:ring-2 focus:ring-indigo-500 bg-white">
                            <option selected>IT Year 1 - Batch A</option>
                            <option>IT Year 1 - Batch B</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-slate-600 mb-1">Attendance Date</label>
                        <input type="date" name="date" id="studentDate" class="w-full text-xs px-3 py-2 border border-slate-200 rounded-lg focus:ring-2 focus:ring-indigo-500" required>
                    </div>
                    <button type="button" onclick="addStudentRow()" class="flex items-center justify-center gap-2 border border-slate-200 hover:bg-slate-50 text-slate-700 text-xs font-semibold px-3.5 py-2 rounded-lg">
                        <i class="fa-solid fa-user-plus"></i> Add Student
                    </button>
                </div>

                <div class="bg-white rounded-xl border border-slate-200 shadow-sm overflow-hidden">
                    <table class="w-full text-left border-collapse text-xs">
                        <thead class="bg-slate-50 border-b border-slate-200 text-slate-600 uppercase font-semibold">
                        <tr>
                            <th class="py-3.5 px-6">Student ID</th>
                            <th class="py-3.5 px-6">Student Name</th>
                            <th class="py-3.5 px-6">Status</th>
                            <th class="py-3.5 px-6"></th>
                        </tr>
                        </thead>
                        <tbody id="studentTbody" class="divide-y divide-slate-100">
                        <tr>
                            <td class="py-3 px-6"><input type="text" name="studentId" value="ST001" class="w-full text-xs px-3 py-2 border border-slate-200 rounded-lg" required></td>
                            <td class="py-3 px-6"><input type="text" name="studentName" value="Nimal Perera" class="w-full text-xs px-3 py-2 border border-slate-200 rounded-lg" required></td>
                            <td class="py-3 px-6">
                                <select name="status" class="w-full text-xs px-3 py-2 border border-slate-200 rounded-lg font-semibold">
                                    <option value="Present">Present</option>
                                    <option value="Absent">Absent</option>
                                </select>
                            </td>
                            <td class="py-3 px-6 text-center"><button type="button" class="text-rose-500 hover:text-rose-700" onclick="this.closest('tr').remove()"><i class="fa-solid fa-xmark"></i></button></td>
                        </tr>
                        </tbody>
                    </table>
                    <div class="p-4 border-t border-slate-100 flex justify-end">
                        <button type="submit" class="flex items-center gap-2 bg-indigo-600 hover:bg-indigo-700 text-white text-xs font-semibold px-4 py-2 rounded-lg shadow-sm">
                            <i class="fa-solid fa-floppy-disk"></i> Save Student Attendance
                        </button>
                    </div>
                </div>
            </form>
        </div>

        <div id="teacherSection" class="tab-section space-y-4">
            <form action="/save-teacher-attendance" method="POST" class="space-y-4">
                <div class="bg-white p-5 rounded-xl border border-slate-200 shadow-sm grid grid-cols-1 md:grid-cols-3 gap-4 items-end">
                    <div>
                        <label class="block text-xs font-semibold text-slate-600 mb-1">Department</label>
                        <input type="text" name="department" class="w-full text-xs px-3 py-2 border border-slate-200 rounded-lg" value="IT Department" required>
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-slate-600 mb-1">Attendance Date</label>
                        <input type="date" name="date" id="teacherDate" class="w-full text-xs px-3 py-2 border border-slate-200 rounded-lg" required>
                    </div>
                    <button type="button" onclick="addTeacherRow()" class="flex items-center justify-center gap-2 border border-slate-200 hover:bg-slate-50 text-slate-700 text-xs font-semibold px-3.5 py-2 rounded-lg">
                        <i class="fa-solid fa-user-plus"></i> Add Teacher
                    </button>
                </div>

                <div class="bg-white rounded-xl border border-slate-200 shadow-sm overflow-hidden">
                    <table class="w-full text-left border-collapse text-xs">
                        <thead class="bg-slate-50 border-b border-slate-200 text-slate-600 uppercase font-semibold">
                        <tr>
                            <th class="py-3.5 px-6">Teacher ID</th>
                            <th class="py-3.5 px-6">Teacher Name</th>
                            <th class="py-3.5 px-6">Status</th>
                            <th class="py-3.5 px-6"></th>
                        </tr>
                        </thead>
                        <tbody id="teacherTbody" class="divide-y divide-slate-100">
                        <tr>
                            <td class="py-3 px-6"><input type="text" name="teacherId" value="T001" class="w-full text-xs px-3 py-2 border border-slate-200 rounded-lg" required></td>
                            <td class="py-3 px-6"><input type="text" name="teacherName" value="Dr. Perera" class="w-full text-xs px-3 py-2 border border-slate-200 rounded-lg" required></td>
                            <td class="py-3 px-6">
                                <select name="status" class="w-full text-xs px-3 py-2 border border-slate-200 rounded-lg font-semibold">
                                    <option value="Present">Present</option>
                                    <option value="Absent">Absent</option>
                                </select>
                            </td>
                            <td class="py-3 px-6 text-center"><button type="button" class="text-rose-500 hover:text-rose-700" onclick="this.closest('tr').remove()"><i class="fa-solid fa-xmark"></i></button></td>
                        </tr>
                        </tbody>
                    </table>
                    <div class="p-4 border-t border-slate-100 flex justify-end">
                        <button type="submit" class="flex items-center gap-2 bg-indigo-600 hover:bg-indigo-700 text-white text-xs font-semibold px-4 py-2 rounded-lg shadow-sm">
                            <i class="fa-solid fa-floppy-disk"></i> Save Teacher Attendance
                        </button>
                    </div>
                </div>
            </form>
        </div>
    </div>
</main>

<script>
    document.addEventListener('DOMContentLoaded', () => {
        const today = new Date().toISOString().split('T')[0];
        document.getElementById('studentDate').value = today;
        document.getElementById('teacherDate').value = today;
    });

    function switchTab(type) {
        const studentSec = document.getElementById('studentSection');
        const teacherSec = document.getElementById('teacherSection');
        const studentBtn = document.getElementById('studentTabBtn');
        const teacherBtn = document.getElementById('teacherTabBtn');
        const title = document.getElementById('pageTitle');
        const subtitle = document.getElementById('pageSubtitle');
        const active = 'px-3 py-1.5 rounded-md text-xs font-semibold bg-white text-indigo-700 shadow-sm';
        const idle = 'px-3 py-1.5 rounded-md text-xs font-semibold text-slate-500 hover:text-slate-800';

        if (type === 'student') {
            studentSec.classList.add('active-tab');
            teacherSec.classList.remove('active-tab');
            studentBtn.className = active;
            teacherBtn.className = idle;
            title.innerText = "Student Attendance Management";
            subtitle.innerText = "Mark and record student attendance for classes";
        } else {
            teacherSec.classList.add('active-tab');
            studentSec.classList.remove('active-tab');
            teacherBtn.className = active;
            studentBtn.className = idle;
            title.innerText = "Teacher Attendance Management";
            subtitle.innerText = "Mark and record teacher attendance for departments";
        }
    }

    let sCount = 2;
    function addStudentRow() {
        const tbody = document.getElementById('studentTbody');
        const row = document.createElement('tr');
        row.innerHTML = `
            <td class="py-3 px-6"><input type="text" name="studentId" value="ST00${sCount++}" class="w-full text-xs px-3 py-2 border border-slate-200 rounded-lg" required></td>
            <td class="py-3 px-6"><input type="text" name="studentName" placeholder="Student Name" class="w-full text-xs px-3 py-2 border border-slate-200 rounded-lg" required></td>
            <td class="py-3 px-6">
                <select name="status" class="w-full text-xs px-3 py-2 border border-slate-200 rounded-lg font-semibold">
                    <option value="Present">Present</option>
                    <option value="Absent">Absent</option>
                </select>
            </td>
            <td class="py-3 px-6 text-center"><button type="button" class="text-rose-500 hover:text-rose-700" onclick="this.closest('tr').remove()"><i class="fa-solid fa-xmark"></i></button></td>
        `;
        tbody.appendChild(row);
    }

    let tCount = 2;
    function addTeacherRow() {
        const tbody = document.getElementById('teacherTbody');
        const row = document.createElement('tr');
        row.innerHTML = `
            <td class="py-3 px-6"><input type="text" name="teacherId" value="T00${tCount++}" class="w-full text-xs px-3 py-2 border border-slate-200 rounded-lg" required></td>
            <td class="py-3 px-6"><input type="text" name="teacherName" placeholder="Teacher Name" class="w-full text-xs px-3 py-2 border border-slate-200 rounded-lg" required></td>
            <td class="py-3 px-6">
                <select name="status" class="w-full text-xs px-3 py-2 border border-slate-200 rounded-lg font-semibold">
                    <option value="Present">Present</option>
                    <option value="Absent">Absent</option>
                </select>
            </td>
            <td class="py-3 px-6 text-center"><button type="button" class="text-rose-500 hover:text-rose-700" onclick="this.closest('tr').remove()"><i class="fa-solid fa-xmark"></i></button></td>
        `;
        tbody.appendChild(row);
    }
</script>
</body>
</html>
