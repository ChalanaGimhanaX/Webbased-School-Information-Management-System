# ---------------------------------------------------------------------------
# UC04 - Microsoft SQL Server profile
# Activate with: SPRING_PROFILES_ACTIVE=sqlserver
# Schema reference: src/main/resources/sqlserver-schema.sql
# Required env var: DB_PASSWORD (optionally DB_URL / DB_USERNAME)
# ---------------------------------------------------------------------------
spring.datasource.url=${DB_URL:jdbc:sqlserver://localhost\\SQLEXPRESS;databaseName=SIS BASE;encrypt=true;trustServerCertificate=true}
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver
spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD}
spring.jpa.database-platform=org.hibernate.dialect.SQLServerDialect

# H2 console is not relevant when using SQL Server
spring.h2.console.enabled=false
