<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EduCore SIS - Edit Teacher Attendance</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap');
        body { font-family: 'Plus Jakarta Sans', sans-serif; }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 antialiased min-h-screen flex">

<aside th:replace="~{fragments/sidebar :: nav('teacher-attendance')}"></aside>

<main class="flex-1 flex flex-col min-w-0 overflow-y-auto">
    <header class="h-16 bg-white border-b border-slate-200 px-6 flex items-center justify-between sticky top-0 z-10">
        <div>
            <h1 class="text-lg font-bold text-slate-900">Edit Teacher Attendance</h1>
            <p class="text-xs text-slate-500">Update faculty attendance record</p>
        </div>
        <a th:href="@{/view-teacher-attendance}" class="flex items-center gap-2 border border-slate-200 hover:bg-slate-50 text-slate-600 text-xs font-semibold px-3.5 py-2 rounded-lg">
            <i class="fa-solid fa-arrow-left"></i> Back to Teacher Records
        </a>
    </header>

    <div class="p-6 max-w-3xl w-full mx-auto">
        <div class="bg-white rounded-xl border border-slate-200 shadow-sm p-6">
            <h2 class="font-bold text-slate-800 text-sm mb-4">Editing Record #<span th:text="${teacher.id}">1</span></h2>
            <form th:action="@{/update-teacher-attendance/{id}(id=${teacher.id})}" method="post" class="grid grid-cols-1 md:grid-cols-2 gap-4">
                <div>
                    <label class="block text-xs font-semibold text-slate-600 mb-1">Teacher ID</label>
                    <input type="text" class="w-full text-xs px-3 py-2 border border-slate-200 rounded-lg" name="teacherId" th:value="${teacher.teacherId}" required>
                </div>
                <div>
                    <label class="block text-xs font-semibold text-slate-600 mb-1">Teacher Name</label>
                    <input type="text" class="w-full text-xs px-3 py-2 border border-slate-200 rounded-lg" name="teacherName" th:value="${teacher.teacherName}" required>
                </div>
                <div>
                    <label class="block text-xs font-semibold text-slate-600 mb-1">Department</label>
                    <input type="text" class="w-full text-xs px-3 py-2 border border-slate-200 rounded-lg" name="department" th:value="${teacher.department}" required>
                </div>
                <div>
                    <label class="block text-xs font-semibold text-slate-600 mb-1">Attendance Date</label>
                    <input type="date" class="w-full text-xs px-3 py-2 border border-slate-200 rounded-lg" name="date" th:value="${teacher.date}" required>
                </div>
                <div class="md:col-span-2">
                    <label class="block text-xs font-semibold text-slate-600 mb-1">Status</label>
                    <select class="w-full text-xs px-3 py-2 border border-slate-200 rounded-lg" name="status" required>
                        <option value="Present" th:selected="${teacher.status == 'Present'}">Present</option>
                        <option value="Absent" th:selected="${teacher.status == 'Absent'}">Absent</option>
                    </select>
                </div>
                <div class="md:col-span-2 flex gap-2 pt-2">
                    <button type="submit" class="flex-1 bg-indigo-600 hover:bg-indigo-700 text-white text-xs font-semibold px-4 py-2 rounded-lg shadow-sm">Update Record</button>
                    <a th:href="@{/view-teacher-attendance}" class="px-4 py-2 text-xs font-semibold border border-slate-200 rounded-lg hover:bg-slate-50">Cancel</a>
                </div>
            </form>
        </div>
    </div>
</main>
</body>
</html>
