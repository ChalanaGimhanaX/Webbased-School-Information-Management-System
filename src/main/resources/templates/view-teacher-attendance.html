<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>View Teacher Attendance - EduCore</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-light">

<div class="container mt-5">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2>Teacher Attendance Records</h2>
        <a href="/teacher-attendance" class="btn btn-primary"><i class="fas fa-plus"></i> Mark New Attendance</a>
    </div>

    <div class="card shadow-sm p-3">
        <table class="table table-hover align-middle">
            <thead class="table-dark">
            <tr>
                <th>ID</th>
                <th>TEACHER ID</th>
                <th>TEACHER NAME</th>
                <th>DEPARTMENT</th>
                <th>DATE</th>
                <th>STATUS</th>
                <th>ACTIONS</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="t : ${teachers}">
                <td th:text="${t.id}">1</td>
                <td th:text="${t.teacherId}">T001</td>
                <td th:text="${t.teacherName}">Kamal Perera</td>
                <td th:text="${t.department}">IT</td>
                <td th:text="${t.date}">2026-09-18</td>
                <td>
                    <span class="badge bg-success" th:if="${t.status == 'Present'}">Present</span>
                    <span class="badge bg-danger" th:if="${t.status == 'Absent'}">Absent</span>
                </td>
                <td>
                    <!-- Edit Button -->
                    <a th:href="@{/edit-teacher-attendance/{id}(id=${t.id})}" class="btn btn-sm btn-warning text-white">
                        <i class="fas fa-edit"></i> Edit
                    </a>

                    <!-- Delete Button -->
                    <a th:href="@{/delete-teacher-attendance/{id}(id=${t.id})}" class="btn btn-sm btn-danger" onclick="return confirm('Are you sure you want to delete this record?');">
                        <i class="fas fa-trash"></i> Delete
                    </a>
                </td>
            </tr>
            </tbody>
        </table>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
