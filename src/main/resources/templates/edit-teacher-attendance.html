<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Edit Teacher Attendance - EduCore</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<div class="container mt-5" style="max-width: 600px;">
    <div class="card shadow p-4">
        <h2 class="mb-4 text-center">Edit Teacher Attendance</h2>

        <form th:action="@{/update-teacher-attendance/{id}(id=${teacher.id})}" method="post">

            <div class="mb-3">
                <label class="form-label">Teacher ID</label>
                <input type="text" class="form-control" name="teacherId" th:value="${teacher.teacherId}" required>
            </div>

            <div class="mb-3">
                <label class="form-label">Teacher Name</label>
                <input type="text" class="form-control" name="teacherName" th:value="${teacher.teacherName}" required>
            </div>

            <div class="mb-3">
                <label class="form-label">Department</label>
                <input type="text" class="form-control" name="department" th:value="${teacher.department}" required>
            </div>

            <div class="mb-3">
                <label class="form-label">Date</label>
                <input type="date" class="form-control" name="date" th:value="${teacher.date}" required>
            </div>

            <div class="mb-3">
                <label class="form-label">Status</label>
                <select class="form-select" name="status" required>
                    <option value="Present" th:selected="${teacher.status == 'Present'}">Present</option>
                    <option value="Absent" th:selected="${teacher.status == 'Absent'}">Absent</option>
                </select>
            </div>

            <button type="submit" class="btn btn-success w-100">Update Teacher Attendance</button>
            <a href="/view-teacher-attendance" class="btn btn-secondary w-100 mt-2">Cancel</a>
        </form>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
