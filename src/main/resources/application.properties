# Server Port
server.port=8080

# Application Name
spring.application.name=SchoolSystem

# ---------------------------------------------------------------------------
# Default profile: H2 in-memory database (zero setup, used by UC03 + tests)
# To run against Microsoft SQL Server (UC04) instead, start with:
#   SPRING_PROFILES_ACTIVE=sqlserver   (see application-sqlserver.properties)
# ---------------------------------------------------------------------------
spring.datasource.url=jdbc:h2:mem:schooldb
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

# Hibernate & JPA Properties
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=true

# Live Template Reloading
spring.thymeleaf.cache=false

# H2 Web Console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console